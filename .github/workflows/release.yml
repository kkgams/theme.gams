name: Package and publish themes
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: unit-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require matching version tag at checkout HEAD
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py identity --tag "$GITHUB_REF_NAME"
      - name: Independently stage and check candidate
        run: |
          make --no-print-directory -s version
          make package OUT=build.nosync/dist/candidate
          make check-package OUT=build.nosync/dist/candidate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-${{ github.sha }}
          path: build.nosync/dist/candidate/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: python3 scripts/release.py identity --tag "$GITHUB_REF_NAME"
      - run: python3 scripts/release.py absent --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unit-${{ github.sha }}
          path: build.nosync/dist/candidate/
      - run: make check-package OUT=build.nosync/dist/candidate
      - name: Publish immutable tag release
        run: |
          python3 scripts/release.py absent --tag "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes build.nosync/dist/candidate/*
